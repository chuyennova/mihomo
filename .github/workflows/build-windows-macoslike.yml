name: Build Windows macOS-like Mihomo v3.2.1 IPv6

on:
  workflow_dispatch:
  push:
    branches:
      - macoslike-v1.19.29
    paths:
      - "adapter/outbound/wireguard.go"
      - "go.mod"
      - "go.sum"
      - "tools/macoslike/**"
      - ".github/workflows/build-windows-macoslike.yml"

concurrency:
  group: macoslike-v3-2-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-amd64-v3-2-1:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
      GOAMD64: v2
      GOTOOLCHAIN: local
      WINTUN_VERSION: "0.14.1"
      WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up MetaCubeX Go 1.26
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: true

      - name: Verify source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          go version
          grep '^module github.com/metacubex/mihomo$' go.mod
          grep -F 'github.com/metacubex/sing-wireguard v0.0.0-20260520151737-7e7c7c1b854c' go.mod
          grep -F 'github.com/metacubex/gvisor v0.0.0-20251227095601-261ec1326fe8' go.mod
          test -f tools/macoslike/apply_macoslike.py

      - name: Update embedded CA bundle
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates unzip zip
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Vendor locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          rm -rf vendor
          go mod vendor
          test -f vendor/github.com/metacubex/sing-wireguard/device_stack.go
          test -f vendor/github.com/metacubex/sing-wireguard/gonet.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/stack/registration.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/network/ipv6/ipv6.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/protocol.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/endpoint.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/connect.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/endpoint.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/forwarder.go
          test -f vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/internal/network/endpoint.go

      - name: Apply WireGuard-only macOS-like v3.2.1 profile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/macoslike/apply_macoslike.py --root .
          gofmt -w \
            adapter/outbound/wireguard.go \
            vendor/github.com/metacubex/sing-wireguard/device_stack.go \
            vendor/github.com/metacubex/sing-wireguard/gonet.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/stack/registration.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/network/ipv6/ipv6.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/protocol.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/endpoint.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/connect.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/endpoint.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/internal/network/endpoint.go
          python3 tools/macoslike/apply_macoslike.py --root . --verify-only

      - name: Verify expected IPv4 and IPv6 profile in source
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'NewStackDeviceMacOSLike' adapter/outbound/wireguard.go
          ! grep -q 'NewStackDeviceMacOSLike' adapter/outbound/openvpn.go
          ! grep -q 'NewStackDeviceMacOSLike' adapter/outbound/masque.go
          grep -n 'return math.MaxUint16' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/endpoint.go
          grep -n 'return 4' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/endpoint.go
          grep -n 'tf.df = true' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/connect.go
          grep -n 'SetPortRange(49152, 65535)' vendor/github.com/metacubex/sing-wireguard/device_stack.go
          grep -n 'udp.NewProtocolMacOSLike' vendor/github.com/metacubex/sing-wireguard/device_stack.go
          grep -n 'IPv6FlowLabel uint32' vendor/github.com/metacubex/gvisor/pkg/tcpip/stack/registration.go
          grep -n 'FlowLabel:.*params.IPv6FlowLabel' vendor/github.com/metacubex/gvisor/pkg/tcpip/network/ipv6/ipv6.go
          grep -n 'func NewProtocolMacOSLike' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go
          grep -n 'SetIPv6FlowLabel' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/endpoint.go
          grep -n 'func newEndpoint(s \*stack.Stack' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/endpoint.go
          grep -n 'newEndpoint(r.stack, r.pkt.NetworkProtocolNumber, queue)' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/forwarder.go
          ! grep -q 'func newEndpoint(p \*protocol' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/endpoint.go
          grep -n 'rng := p.stack.SecureRNG()' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/protocol.go
          grep -n 'return rng.Uint32() & 0x000fffff' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/protocol.go
          grep -n 'rng := p.stack.SecureRNG()' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go
          grep -n 'return rng.Uint32() & 0x000fffff' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go
          ! grep -R -q 'SecureRNG().Uint32()' \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/protocol.go \
            vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go
          ! grep -q 'for label == 0' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/tcp/protocol.go
          ! grep -q 'for label == 0' vendor/github.com/metacubex/gvisor/pkg/tcpip/transport/udp/protocol.go

      - name: Build verge-mihomo.exe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="macoslike-v3.2.1-v1.19.29-${GITHUB_SHA::7}"
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -mod=vendor \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid=" \
            -o dist/verge-mihomo.exe \
            .
          test -s dist/verge-mihomo.exe

      - name: Add official wintun.dll
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip" \
            --output /tmp/wintun.zip
          echo "${WINTUN_SHA256}  /tmp/wintun.zip" | sha256sum --check --strict
          DLL_PATH="$(unzip -Z1 /tmp/wintun.zip | grep -E '(^|/)bin/amd64/wintun\.dll$' | head -n 1)"
          test -n "${DLL_PATH}"
          unzip -p /tmp/wintun.zip "${DLL_PATH}" > dist/wintun.dll
          test -s dist/wintun.dll

          LICENSE_PATH="$(unzip -Z1 /tmp/wintun.zip | grep -Ei '(^|/)(prebuilt-binaries-license|license)(\.txt)?$' | head -n 1 || true)"
          if [ -n "${LICENSE_PATH}" ]; then
            unzip -p /tmp/wintun.zip "${LICENSE_PATH}" > dist/LICENSE-wintun.txt
          else
            printf '%s\n' 'Official signed Wintun binary; see the upstream Wintun archive for its redistribution license.' > dist/LICENSE-wintun.txt
          fi

      - name: Package Clash Verge core
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE dist/LICENSE-mihomo.txt
          cat > dist/BUILD_INFO.txt <<EOF
          Core: verge-mihomo.exe
          Base: Mihomo v1.19.29
          Target: Windows amd64 GOAMD64=v2
          Scope: WireGuard outbound only; one independent gVisor stack per outbound
          TCP profile: macOS-like v3.2.1 active client profile
          IPv4 expected: window=65535, ws=4, ttl=64, DF=1, atomic IPv4-ID=0
          TCP options: MSS,NOP,WS,NOP,NOP,TS,SACK,EOL+padding
          IPv6 expected: hop-limit=64, traffic-class inherited (normally 0), no ordinary extension header
          IPv6 Flow Label: XNU-style random 20-bit value (zero statistically possible), stable for one TCP flow or UDP socket
          MSS: derived from actual WireGuard MTU; MTU 1360 => IPv4 MSS 1320, IPv6 MSS 1300
          Git commit: ${GITHUB_SHA}
          EOF
          (
            cd dist
            sha256sum verge-mihomo.exe wintun.dll > SHA256SUMS.txt
            zip -9 -r ../verge-mihomo-windows-macoslike-v3.2.1-ipv6-amd64.zip \
              verge-mihomo.exe \
              wintun.dll \
              LICENSE-mihomo.txt \
              LICENSE-wintun.txt \
              BUILD_INFO.txt \
              SHA256SUMS.txt
          )
          unzip -l verge-mihomo-windows-macoslike-v3.2.1-ipv6-amd64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verge-mihomo-windows-macoslike-v3.2.1-ipv6-amd64-${{ github.sha }}
          path: |
            verge-mihomo-windows-macoslike-v3.2.1-ipv6-amd64.zip
            dist/verge-mihomo.exe
            dist/wintun.dll
            dist/BUILD_INFO.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
